name: Deploy an EC2

on:
  push:
    branches:
      - cicd

jobs:
  deploy1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Run a linux command
        run: ls -la

  deploy2:
    runs-on: ubuntu-latest
    needs: deploy1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Run a linux command
        run: cat index.html
